name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . )
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with the race detector
        run: go test -race -p 1 ./internal/store/ ./internal/importer/ ./internal/web/

      - name: Build
        run: go build ./cmd/enclave

  windows-build:
    name: Windows build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Cross-compile
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_SHA::8}" \
            -o ENCLAVE.exe ./cmd/enclave

      - uses: actions/upload-artifact@v4
        with:
          name: ENCLAVE-windows-amd64
          path: ENCLAVE.exe
          if-no-files-found: error

  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: |
          docker build --target runtime \
            --build-arg VERSION="ci-${GITHUB_SHA::8}" \
            -t enclave:ci .

      - name: It runs as uid 65532, not root
        run: |
          id="$(docker run --rm --entrypoint id enclave:ci -u)"
          echo "runs as uid $id"
          test "$id" = "65532"

      - name: It works under the constraints the compose file imposes
        run: |
          set -eux
          docker run -d --name enclave-ci \
            --read-only --tmpfs /tmp:size=256m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v enclave-ci-data:/data \
            -p 127.0.0.1:8080:8080 \
            enclave:ci

          # The image's own health check has to come good on its own.
          for _ in $(seq 1 30); do
            if docker exec enclave-ci /usr/local/bin/enclave healthcheck; then break; fi
            sleep 1
          done
          docker exec enclave-ci /usr/local/bin/enclave healthcheck

          curl -fsS http://127.0.0.1:8080/healthz

          # A real piece of work, not just a page load: create an enclave,
          # import a STIG checklist, and read a rule back out of it. This is
          # what proves the read-only root filesystem and the tmpfs are
          # enough for an upload to be parsed.
          curl -fsS -o /dev/null -X POST http://127.0.0.1:8080/enclaves/new \
            -d 'name=CI&id=CI&environment=Production&status=Active'
          curl -fsS -o /dev/null -F 'file=@testdata/sample.ckl' \
            -F 'enclave_id=CI' -F 'create_assets=on' \
            http://127.0.0.1:8080/import
          curl -fsS http://127.0.0.1:8080/enclaves/CI/findings | grep -q 'V-254238'

          # And that an operator can get a backup out of a running instance.
          docker exec enclave-ci /usr/local/bin/enclave backup -o /data/ci.zip

      - name: The health check fails when there is nothing to answer
        run: |
          docker stop enclave-ci
          docker rm -f enclave-ci
          docker volume rm -f enclave-ci-data
          if docker run --rm --network none enclave:ci healthcheck --timeout 2s; then
            echo "healthcheck passed with nothing listening" >&2
            exit 1
          fi

      # The file people paste into a NAS differs from the compose file at the
      # root in the two ways most likely to break: it runs as a named user and
      # it binds a directory on the host rather than a Docker volume. Both go
      # untested if only the root compose file is exercised.
      - name: The TrueNAS YAML works exactly as shipped
        run: |
          set -eux
          data="${RUNNER_TEMP}/enclave-data"
          mkdir -p "$data"
          sudo chown -R 568:568 "$data"

          # Only the two lines the file tells people to change.
          sed -e "s|ghcr.io/gaterunner341/enclave:latest|enclave:ci|" \
              -e "s|/mnt/tank/apps/enclave:/data|${data}:/data|" \
              deploy/truenas/enclave.yaml > "${RUNNER_TEMP}/truenas.yaml"

          docker compose -p truenas -f "${RUNNER_TEMP}/truenas.yaml" up -d --wait
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS -o /dev/null -X POST http://127.0.0.1:8080/enclaves/new \
            -d 'name=NAS&id=NAS&environment=Production&status=Active'
          curl -fsS http://127.0.0.1:8080/enclaves | grep -q 'NAS'

          # The records have to land in the directory on the host, owned by
          # the user the container runs as. That is the entire point of the
          # bind mount, and it is what a snapshot of the dataset picks up.
          sudo test -f "${data}/enclaves.json"
          sudo stat -c '%u:%g' "${data}/enclaves.json" | grep -qx '568:568'

          docker compose -p truenas -f "${RUNNER_TEMP}/truenas.yaml" down -v

      # Forgetting the chown is the usual way this deployment fails, and with
      # a restart policy it fails on a loop. What it says while doing that is
      # the difference between a one-command fix and an afternoon.
      - name: An unwritable directory says what to do about it
        run: |
          set -eux
          bad="${RUNNER_TEMP}/enclave-bad"
          mkdir -p "$bad"
          sudo chown -R 0:0 "$bad"
          sudo chmod 0755 "$bad"

          out="$(docker run --rm --user 568:568 -v "$bad":/data enclave:ci serve 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "cannot write to the data directory"
          echo "$out" | grep -q "chown -R 568:568"
          if echo "$out" | grep -q '\.json\.tmp'; then
            echo "the error named a temporary file again" >&2
            exit 1
          fi

      - name: The proxy configuration is valid and formatted
        run: |
          set -eu
          # Caddy complains in its own startup log about a Caddyfile that is
          # not formatted, and that warning lands in the operator's logs every
          # time the proxy starts. Catch it here instead.
          docker run --rm -v "$PWD/deploy:/d:ro" caddy:2-alpine \
            caddy fmt --diff /d/Caddyfile | tee /tmp/caddyfmt.diff
          if grep -qE '^[-+]' /tmp/caddyfmt.diff; then
            echo "deploy/Caddyfile is not formatted; the diff above is what caddy fmt wants" >&2
            exit 1
          fi

      - name: The compose file comes up, proxy and all
        run: |
          set -eux
          docker compose config >/dev/null

          # The proxy is meant to refuse to start without any accounts, so
          # give it one before asking it to run.
          hash="$(docker run --rm caddy:2-alpine caddy hash-password --plaintext 'ci-password')"
          printf 'basic_auth {\n\tci %s\n}\n' "$hash" > deploy/auth/users.conf

          ENCLAVE_IMAGE=enclave:ci docker compose --profile tls up -d --wait

          # No password, no entry.
          code="$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/healthz)"
          test "$code" = "401"

          # With one, straight through to ENCLAVE.
          curl -fsSk -u ci:ci-password https://localhost/healthz

          # And plain HTTP is redirected rather than served. Caddy adds that
          # redirect itself for an HTTPS site, so the exact code is its
          # business; what matters is that nothing is answered in the clear.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)"
          case "$code" in
            301 | 302 | 307 | 308) ;;
            *)
              echo "plain HTTP answered $code instead of redirecting" >&2
              exit 1
              ;;
          esac

      - name: Logs, whatever happened
        if: always()
        run: docker compose --profile tls logs --no-color || true

      - name: Stop
        if: always()
        run: docker compose --profile tls down -v --remove-orphans || true
