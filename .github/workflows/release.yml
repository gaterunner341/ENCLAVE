name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...
      - name: Build the Windows package
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/ENCLAVE.exe ./cmd/enclaved
          cp "START HERE.txt" dist/
          cd dist && zip -r "../ENCLAVE-${GITHUB_REF_NAME}-windows.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          files: ENCLAVE-*-windows.zip
