name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish under (for a manual run)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Test
        run: go test ./...

      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build every platform
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          build() {
            goos=$1; goarch=$2; ext=$3
            out="dist/enclave-${goos}-${goarch}${ext}"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "$out" ./cmd/enclave
            echo "built $out"
          }
          build windows amd64 .exe
          build windows arm64 .exe
          build linux   amd64 ""
          build linux   arm64 ""
          build darwin  amd64 ""
          build darwin  arm64 ""

          # The Windows build is also published under the plain name people
          # expect to be handed.
          cp dist/enclave-windows-amd64.exe dist/ENCLAVE.exe

          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
