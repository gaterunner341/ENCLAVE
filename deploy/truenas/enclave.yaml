# ENCLAVE as a YAML app.
#
# Paste this in and start it. One thing to change: in the "volumes" section
# near the bottom, the path to the LEFT of ":/data" — that is a directory on
# this machine. Leave "/data" itself alone; that is the path inside the
# container. Nothing has to be created or chowned first — the container takes
# ownership of that directory itself and then drops to an unprivileged user,
# so the server never runs as root.
#
# Works anywhere that takes a compose file: TrueNAS (Apps, Discover Apps, the
# three-dot menu, Install via YAML), Portainer, Unraid, or "docker compose
# up -d" on a plain machine.

services:
  enclave:
    image: ghcr.io/gaterunner341/enclave:latest
    restart: unless-stopped

    environment:
      # Inside the container ENCLAVE binds every interface. What the machine
      # exposes is decided by "ports".
      ENCLAVE_ADDR: 0.0.0.0:8080
      ENCLAVE_DATA: /data
      # "on" serves the interface but refuses every change — for an instance
      # an auditor or a programme office only reads.
      ENCLAVE_READ_ONLY: "off"
      # The zone timestamps are written in.
      TZ: UTC
      # Who the server runs as, and who the data directory ends up owned by.
      # 568 is the "apps" user on TrueNAS; leave these out entirely and it is
      # 65532. Either way you do not have to prepare the directory.
      PUID: "568"
      PGID: "568"

    ports:
      # Machine port : container port.
      #
      # Do not use 80 or 443 on a NAS. Its own web interface is there and the
      # app will fail to start with a port conflict.
      - "8080:8080"

    volumes:
      # Change the LEFT side only. The right side is the path inside the
      # container and must stay exactly "/data".
      #
      #     /mnt/tank/apps/enclave  :  /data
      #     \_______ your path ____/     \_ leave alone
      #
      # The left side is a directory on this machine. On TrueNAS that is
      # /mnt/<your pool>/<whatever you call it> — "tank" below is a
      # placeholder for your own pool name, which Storage shows you. Make a
      # dataset for it if you want to snapshot it on its own; otherwise any
      # path under your pool will do and it will be created if missing.
      #
      # Everything ENCLAVE knows ends up there: enclaves, assets, findings,
      # scans, catalogues, mappings, the people directory and connector
      # credentials. Keeping it on a real directory rather than in a Docker
      # volume is what lets you snapshot and replicate it with everything
      # else on the machine.
      - /mnt/tank/apps/enclave:/data

      # Optional, and the same rule: change the left side, leave "/certs".
      # A CA certificate for a Tenable Security Center signed by your own PKI
      # goes in that directory and is referenced on the connector as
      # /certs/<filename>. Delete these lines if you are not pulling from a
      # Security Center.
      # - /mnt/tank/apps/enclave-certs:/certs:ro

    # ENCLAVE writes to the data directory and nowhere else. The tmpfs is
    # where a large scan upload spills while it is being parsed.
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777

    # Everything is dropped except what the entry point needs to hand the
    # data directory over and step down out of root.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "/usr/local/bin/enclave", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
