{{template "head" .}}
{{$d := .Data}}
<div class="card" style="max-width: 640px; margin: 3rem auto">
  <div class="empty">
    <h1 style="font-size: 3rem; color: var(--text-3); margin-bottom: .25rem">{{$d.Code}}</h1>
    <h3>{{$d.Status}}</h3>
    <p>{{$d.Message}}</p>
    <a class="btn primary" href="/">Back to the overview</a>
  </div>
</div>
{{template "foot" .}}
